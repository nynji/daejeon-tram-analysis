# ─────────────────────────────────────────────────────────
# MCLP 최적화 파라미터 설정
# ─────────────────────────────────────────────────────────

# 기본 파라미터
solver:
  P: 10                      # 배치할 거점 최대 개수
  coverage_radius_km: 1.0    # 커버리지 반경 (km)
  alpha: 0.6                 # 최소 커버리지 하한 비율 (0~1)
  D_min_m: 300               # 거점 간 최소 이격 거리 (m)
  time_limit_sec: 120        # 솔버 최대 실행시간 (초)
  amr_speed_kmh: 10.0        # AMR 최대 주행속도 (km/h)

# 용량 설정
capacity:
  parking_to_robot_ratio: 0.5  # 주차면수 → 로봇 수용 대수 변환 비율
  min_capacity: 1              # 최소 수용 용량

# Soft 제약 패널티/인센티브 계수
soft_constraints:
  # 제약2: 택배 주정차 허용구역 인센티브
  parking_incentive: 1.3
  parking_time_start: "10:00"
  parking_time_end: "17:00"

  # 제약4: 경사도 패널티
  slope_5pct_penalty: 0.7
  slope_10pct_penalty: 0.4

  # 제약6: CCTV 단속 유예 인센티브
  enforcement_grace_incentive: 1.2
  grace_time_start: "11:30"
  grace_time_end: "13:30"

  # 제약8: 보호구역 패널티
  school_zone_penalty: 0.6
  silver_zone_penalty: 0.7

  # 제약10: 교차로 횡단 패널티
  crosswalk_penalty_per_crossing: 0.95
  crosswalk_heavy_penalty_per_crossing: 0.90
  crosswalk_heavy_threshold: 5

# 수요 가중치 설정
weights:
  high_risk_incentive: 1.5     # 🔴심각/🟠경고 구간 인센티브
  use_integrated_score: true   # 통합 스코어 사용 여부

# Hard 제약 임계값
hard_constraints:
  # 제약1: 도로위계
  min_road_width_m: 4.0
  min_lanes: 2

  # 제약3: 집중호우 굴착면
  heavy_rain_threshold_mm: 30.0
  excavation_buffer_m: 100.0

  # 제약5: 기상특보
  snow_threshold_cm: 3.0
  freezing_temp_c: 0.0

  # 제약7: 소방시설
  fire_hydrant_buffer_m: 5.0

  # 제약9: 보도 유효폭
  min_sidewalk_width_m: 1.0

  # 제약11: 타임윈도우 (분)
  max_delivery_time_min: 6.0

  # 제약12: 용량
  enabled: true

# 시나리오 비교용
scenarios:
  - name: "기본"
    P: 10
    coverage_radius_km: 1.0
  - name: "확장 거점"
    P: 15
    coverage_radius_km: 1.0
  - name: "넓은 반경"
    P: 10
    coverage_radius_km: 1.5
  - name: "최대 커버리지"
    P: 20
    coverage_radius_km: 1.5
