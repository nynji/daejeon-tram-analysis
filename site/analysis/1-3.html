<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>1-3. 정체 패턴 군집</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="../assets/css/common.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div class="page-header">
      <div><h1>1-3. 정체 패턴 군집 (K-means/DTW)</h1></div>
    </div>

    <div class="card-grid" id="cluster-count-cards"></div>

    <div class="layout-2col">
      <div>
        <div class="panel">
          <h2>클러스터 분포 지도</h2>
          <div id="map-1-3" class="map-container"></div>
        </div>
      </div>
      <div>
        <div class="panel">
          <h2>24시간 프로파일 오버레이</h2>
          <select id="seg-select" class="control-select" style="margin-bottom:10px; width:100%;"></select>
          <canvas id="profile-chart" height="220"></canvas>
        </div>
        <div class="panel">
          <h2>클러스터별 구간 수</h2>
          <canvas id="donut-chart" height="200"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../assets/js/nav.js"></script>
<script src="../assets/js/map.js"></script>
<script>
const CLUSTER_COLOR = {
  "상시 저속형": "#e74c3c",
  "시간대 집중 정체형": "#f1c40f",
  "출퇴근 집중형": "#3aa0ff",
  "영향 미미형": "#2ecc71",
};

let profileChart;

(async function () {
  AppNav.renderNav("1-3", "..");

  const [segCatalog, clusters] = await Promise.all([
    fetch("../data/segments.json").then((r) => r.json()),
    fetch("../data/clusters.json").then((r) => r.json()),
  ]);

  document.getElementById("cluster-count-cards").innerHTML = Object.entries(clusters.cluster_counts).map(([label, n]) => `
    <div class="kpi-card">
      <div class="label" style="color:${CLUSTER_COLOR[label] || "#9fb0c0"};">${label}</div>
      <div class="value">${n}<span style="font-size:14px; color:var(--text-dim);"> 구간</span></div>
    </div>`).join("");

  const clustersBySegId = Object.fromEntries(clusters.segments.map((c) => [c.segment_id, c]));

  const map = AppMap.initMap("map-1-3", { zoom: 12 });
  segCatalog.segments.forEach((seg) => {
    const c = clustersBySegId[seg.segment_id];
    const color = CLUSTER_COLOR[c?.dominant_cluster_label] || "#7f8c8d";
    const latlngs = seg.geometry.coordinates.map((line) => line.map(([lng, lat]) => [lat, lng]));
    const layer = L.polyline(latlngs, { color, weight: 4, opacity: 0.9 }).addTo(map);
    layer.on("click", () => {
      const mid = latlngs[0][Math.floor(latlngs[0].length / 2)] || latlngs[0][0];
      const incentiveBadge = c?.mclp_incentive ? `<span class="badge incentive">MCLP 가중치 인센티브 적용</span>` : "";
      L.popup().setLatLng(mid).setContent(`
        <div class="popup-title">${seg.from_station_name} ↔ ${seg.to_station_name}</div>
        <div class="popup-row">${c?.dominant_cluster_label ?? "-"}</div>
        <div class="popup-row">${incentiveBadge}</div>
      `).openOn(map);
    });
  });

  const segSelect = document.getElementById("seg-select");
  clusters.segments.forEach((c) => {
    const opt = document.createElement("option");
    opt.value = c.segment_id;
    opt.textContent = `${c.from_station_name} ↔ ${c.to_station_name} (${c.dominant_cluster_label})`;
    segSelect.appendChild(opt);
  });
  segSelect.addEventListener("change", () => renderProfile(segSelect.value));
  renderProfile(clusters.segments[0].segment_id);

  function renderProfile(segId) {
    const c = clustersBySegId[segId];
    const centroid = clusters.centroid_profiles[c.dominant_cluster_label] || [];
    if (profileChart) profileChart.destroy();
    profileChart = new Chart(document.getElementById("profile-chart"), {
      type: "line",
      data: {
        labels: Array.from({ length: 24 }, (_, h) => `${h}시`),
        datasets: [
          { label: "실제 속도", data: c.hourly_profile, borderColor: "#3aa0ff", pointRadius: 0 },
          { label: `${c.dominant_cluster_label} 소속구간 평균(centroid 근사)`, data: centroid, borderColor: "#9fb0c0", borderDash: [4, 4], pointRadius: 0 },
        ],
      },
      options: {
        plugins: { legend: { labels: { color: "#9fb0c0" } } },
        scales: {
          x: { ticks: { color: "#9fb0c0" }, grid: { color: "#2a3a4a" } },
          y: { ticks: { color: "#9fb0c0" }, grid: { color: "#2a3a4a" } },
        },
      },
    });
  }

  new Chart(document.getElementById("donut-chart"), {
    type: "doughnut",
    data: {
      labels: Object.keys(clusters.cluster_counts),
      datasets: [{ data: Object.values(clusters.cluster_counts), backgroundColor: Object.keys(clusters.cluster_counts).map((l) => CLUSTER_COLOR[l] || "#7f8c8d") }],
    },
    options: { plugins: { legend: { labels: { color: "#9fb0c0" } } } },
  });
})();
</script>
</body>
</html>
