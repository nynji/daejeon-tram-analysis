<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Home — 트램 공사 통합 관제</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="assets/css/common.css" />
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div class="page-header">
      <div>
        <h1>통합 관제 대시보드 — Home</h1>
        <div class="subtitle">관리자·발표용 요약 화면 (관제 요원 계정은 로그인 시 2-1로 자동 이동합니다)</div>
      </div>
      <div id="as-of-label" class="subtitle"></div>
    </div>

    <div class="card-grid">
      <div class="kpi-card">
        <div class="label">현재 심각 구간 수</div>
        <div class="value severe" id="kpi-severe">-</div>
      </div>
      <div class="kpi-card">
        <div class="label">현재 주의 구간 수</div>
        <div class="value warning" id="kpi-warning">-</div>
      </div>
      <div class="kpi-card">
        <div class="label">가동 중 AMR 거점 수</div>
        <div class="value" id="kpi-amr">준비 중</div>
      </div>
      <div class="kpi-card">
        <div class="label">오늘 예상 최고 혼잡 시간대</div>
        <div class="value" id="kpi-peak">17:30–18:30</div>
      </div>
    </div>

    <div class="panel">
      <h2>공구별 위험도 요약 지도</h2>
      <div class="subtitle" style="margin-bottom:10px;">공구를 클릭하면 실시간 병목 경보 지도(2-1)로 이동합니다.</div>
      <div id="home-map" class="map-container"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/map.js"></script>
<script>
(async function () {
  AppNav.applyLandingRedirect(".");
  AppNav.renderNav("home", ".");

  const [segCatalog, snapshot, tools] = await Promise.all([
    fetch("data/segments.json").then((r) => r.json()),
    fetch("data/snapshot_latest.json").then((r) => r.json()),
    fetch("data/tools.json").then((r) => r.json()),
  ]);

  document.getElementById("as-of-label").textContent = `기준 시각: ${snapshot.generated_from_timestamp} (시뮬레이션)`;
  document.getElementById("kpi-severe").textContent = tools.kpi.severe_segment_count;
  document.getElementById("kpi-warning").textContent = tools.kpi.warning_segment_count;

  const snapshotByKey = Object.fromEntries(snapshot.segments.map((s) => [s.segment_key, s]));
  const toolByNo = Object.fromEntries(tools.tools.map((t) => [t.tool_no, t]));

  const map = AppMap.initMap("home-map", { zoom: 12 });
  const rank = { "🟢 정상": 0, "🟡 주의": 1, "🔴 심각": 2 };
  const layers = AppMap.drawSegments(map, segCatalog.segments, snapshotByKey, (seg) => {
    const t = toolByNo[seg.tool_no];
    const worst = t ? t.worst_risk_grade : "🟢 정상";
    L.popup()
      .setLatLng(seg.geometry.coordinates[0][0] ? [seg.geometry.coordinates[0][0][1], seg.geometry.coordinates[0][0][0]] : map.getCenter())
      .setContent(
        `<div class="popup-title">${seg.tool_no}공구</div>
         <div class="popup-row">공구 최고 위험도: ${worst}</div>
         <div class="popup-row"><a href="control/2-1.html?tool=${seg.tool_no}">실시간 병목 경보 지도에서 보기 →</a></div>`
      )
      .openOn(map);
  });
})();
</script>
</body>
</html>
