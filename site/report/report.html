<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>공구별 리포트</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../assets/css/common.css" />
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div class="page-header">
      <div>
        <h1>🧭 공구별 리포트</h1>
        <div class="subtitle">구간 단위 분석을 공구 단위 행정 보고 포맷으로 요약</div>
      </div>
      <div>
        <select id="tool-select" class="control-select no-print"></select>
        <button class="btn no-print" onclick="window.print()">인쇄 / PDF로 저장</button>
      </div>
    </div>

    <div id="report-body"></div>
  </div>
</div>

<script src="../assets/js/nav.js"></script>
<script>
(async function () {
  AppNav.renderNav("report", "..");
  const tools = await fetch("../data/tools.json").then((r) => r.json());

  const select = document.getElementById("tool-select");
  tools.tools.forEach((t) => {
    const opt = document.createElement("option");
    opt.value = t.tool_no;
    opt.textContent = `${t.tool_no}공구`;
    select.appendChild(opt);
  });
  select.addEventListener("change", () => render(select.value));
  render(tools.tools[0].tool_no);

  function render(toolNo) {
    const t = tools.tools.find((x) => String(x.tool_no) === String(toolNo));
    const rows = t.segments.map((s) => `
      <tr>
        <td>${s.from_station_name} ↔ ${s.to_station_name}</td>
        <td>${s.start_date}</td>
        <td>${s.direction_states.join(", ") || "-"}</td>
      </tr>`).join("");

    document.getElementById("report-body").innerHTML = `
      <div class="subtitle" style="margin-bottom:10px;">기준 시각: ${tools.as_of} (시뮬레이션)</div>
      <div class="card-grid">
        <div class="kpi-card"><div class="label">공구 내 구간 수</div><div class="value">${t.segment_count}</div></div>
        <div class="kpi-card"><div class="label">위험 구간 수(주의+심각)</div><div class="value warning">${t.risky_segment_count}</div></div>
        <div class="kpi-card"><div class="label">공구 최고 위험도</div><div class="value">${t.worst_risk_grade}</div></div>
        <div class="kpi-card"><div class="label">배치된 AMR 거점 수</div><div class="value">${t.amr_site_count}<span style="font-size:12px; color:var(--text-dim);"> (${t.amr_status_note})</span></div></div>
      </div>
      <div class="panel">
        <h2>${t.tool_no}공구 구간 목록</h2>
        <table class="data-table">
          <thead><tr><th>구간</th><th>착공일</th><th>방향별 현재 상태</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }
})();
</script>
</body>
</html>
