<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>2-2. 우회 경로 추천</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../assets/css/common.css" />
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div class="page-header">
      <div>
        <h1>2-2. 우회 경로 추천</h1>
        <div class="subtitle">관제 요원이 VMS·안내방송 문구를 내보내기 전 우회 경로를 사전 검토하는 도구</div>
      </div>
    </div>

    <div class="notice-banner">
      🚧 준비 중입니다. 이번 범위에서는 시간의존 라우팅 로직(Dijkstra/A*, 병목 회피 페널티)을 제외하고 화면 레이아웃만 제공합니다.
    </div>

    <div class="panel">
      <h2>제공 예정 기능</h2>
      <ul style="color:var(--text-dim); line-height:1.9; padding-left:20px;">
        <li>출발지 / 목적지 / 희망 통과 시각 입력</li>
        <li>2-1 실시간 병목 경보 및 1-1 예측 확률을 반영한 우회 경로 추천</li>
        <li>병목 구간 회피 페널티를 반영한 다중 경로 후보 비교</li>
      </ul>
    </div>

    <div class="panel">
      <h2>입력 폼 (비활성)</h2>
      <div class="form-grid">
        <div class="form-field">
          <label>출발지</label>
          <input type="text" placeholder="예: 서대전역" disabled />
        </div>
        <div class="form-field">
          <label>목적지</label>
          <input type="text" placeholder="예: 유성온천역" disabled />
        </div>
        <div class="form-field">
          <label>통과 희망 시각</label>
          <input type="time" disabled />
        </div>
      </div>
      <div style="margin-top:14px;">
        <button class="btn" disabled>경로 추천 (준비 중)</button>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/nav.js"></script>
<script>AppNav.renderNav("2-2", "..");</script>
</body>
</html>
